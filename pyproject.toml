[project]
name = "sistema-carteira"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.27.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30.0",
    "yfinance>=0.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.4.0",
    "testcontainers[postgres]>=4.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette's TestClient nudges towards httpx2; nothing to act on yet.
    "ignore:Using `httpx` with `starlette.testclient`",
]
