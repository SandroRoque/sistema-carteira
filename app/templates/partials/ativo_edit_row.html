<tr id="ativo-{{ a.id }}">
  <td><strong>{{ a.ticker or "—" }}</strong></td>
  <td>
    <input type="text" name="nome" value="{{ a.nome or "" }}" form="edit-ativo-{{ a.id }}" aria-label="Nome">
  </td>
  <td>
    <select name="tipo" form="edit-ativo-{{ a.id }}" aria-label="Tipo">
      {% for t in tipos %}
      <option value="{{ t }}" {% if t == a.tipo %}selected{% endif %}>{{ t | tipo_label }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="num">{{ a.num_negociacoes }}</td>
  <td>
    <input type="checkbox" name="revisado" value="1" form="edit-ativo-{{ a.id }}" aria-label="Revisado" {% if a.revisado %}checked{% endif %}>
  </td>
  <td>
    <div class="botoes">
      <form id="edit-ativo-{{ a.id }}" hx-patch="/ativos/{{ a.id }}" hx-target="#ativo-{{ a.id }}"
            hx-swap="outerHTML" hx-include="[form='edit-ativo-{{ a.id }}']">
        <button type="submit" class="pequeno primario">Salvar</button>
      </form>
      <button class="pequeno" hx-get="/ativos/{{ a.id }}/row" hx-target="#ativo-{{ a.id }}" hx-swap="outerHTML">Cancelar</button>
    </div>
  </td>
</tr>
