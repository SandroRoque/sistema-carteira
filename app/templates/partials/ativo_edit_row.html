<tr id="ativo-{{ a.id }}">
  <td>{{ a.ticker or "—" }}</td>
  <td>
    <input
      type="text"
      name="nome"
      value="{{ a.nome or "" }}"
      form="edit-ativo-{{ a.id }}"
      class="sem-margem"
    >
  </td>
  <td>
    <select name="tipo" form="edit-ativo-{{ a.id }}" class="sem-margem">
      {% for t in tipos %}
      <option value="{{ t }}" {% if t == a.tipo %}selected{% endif %}>{{ t | tipo_label }}</option>
      {% endfor %}
    </select>
  </td>
  <td class="num">{{ a.num_negociacoes }}</td>
  <td>
    <input
      type="checkbox"
      name="revisado"
      value="1"
      form="edit-ativo-{{ a.id }}"
      {% if a.revisado %}checked{% endif %}
      class="sem-margem"
    >
  </td>
  <td>
    <form
      id="edit-ativo-{{ a.id }}"
      hx-patch="/ativos/{{ a.id }}"
      hx-target="#ativo-{{ a.id }}"
      hx-swap="outerHTML"
      hx-include="[form='edit-ativo-{{ a.id }}']"
    >
      <button type="submit" class="small sem-margem espaco-direita">Salvar</button>
    </form>
    <button
      class="outline small sem-margem"
      hx-get="/ativos/{{ a.id }}/row"
      hx-target="#ativo-{{ a.id }}"
      hx-swap="outerHTML"
    >Cancelar</button>
  </td>
</tr>
