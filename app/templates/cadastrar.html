{% extends "base.html" %}
{% block title %}Criar conta — Carteira{% endblock %}

{% block content %}
<article>
  <h2>Criar conta</h2>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/cadastrar">
    <label>
      E-mail
      <input type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
    </label>
    <label>
      Senha <small class="muted">(mínimo de 10 caracteres)</small>
      <input type="password" name="senha" autocomplete="new-password" minlength="10" maxlength="256" required>
    </label>
    <label>
      Repita a senha
      <input type="password" name="senha_confirmacao" autocomplete="new-password" minlength="10" maxlength="256" required>
    </label>
    <label>
      <input type="checkbox" name="aceite" value="true" required>
      Declaro ter direito de usar os documentos que eu enviar e li a
      <a href="/privacidade" target="_blank">política de privacidade</a>.
    </label>
    <button type="submit">Criar conta</button>
  </form>
  <p>Já tem conta? <a href="/entrar">Entrar</a></p>
</article>
{% endblock %}
